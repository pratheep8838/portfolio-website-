<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Pratheep S | Mechanical Design Engineer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Flex:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#F5F7FB;--surface:#FFFFFF;--tonal:#DCE8FA;--on-tonal:#0B2A57;--primary:#1565C0;--on-primary:#FFFFFF;--text:#1B2230;--muted:#586377;--outline:#C5CEDD;--accent:#F9A825;--shadow:0 1px 3px rgba(20,40,80,.18),0 1px 2px rgba(20,40,80,.12);--shadow2:0 6px 16px rgba(20,40,80,.18);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0E1420;--surface:#161E2E;--tonal:#1F3354;--on-tonal:#CFE0FF;--primary:#8AB4F8;--on-primary:#0B2447;--text:#E6EAF2;--muted:#9AA7BD;--outline:#2C3A52;--shadow:0 1px 3px rgba(0,0,0,.5);--shadow2:0 6px 16px rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0E1420;--surface:#161E2E;--tonal:#1F3354;--on-tonal:#CFE0FF;--primary:#8AB4F8;--on-primary:#0B2447;--text:#E6EAF2;--muted:#9AA7BD;--outline:#2C3A52;--shadow:0 1px 3px rgba(0,0,0,.5);--shadow2:0 6px 16px rgba(0,0,0,.55)}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 120px);scroll-behavior:smooth}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:400 16px/1.6 Roboto,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
h1,h2,h3{font-family:"Roboto Flex",Roboto,Arial,sans-serif;margin:0;line-height:1.15}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--surface);box-shadow:var(--shadow)}
.bar-in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:12px}
.brand{font:700 20px "Roboto Flex",Arial,sans-serif;color:var(--primary);margin-right:auto;white-space:nowrap}
.navs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none}
.navs a{padding:8px 14px;border-radius:20px;color:var(--text);text-decoration:none;font-weight:500;white-space:nowrap}
.navs a.on{background:var(--tonal);color:var(--on-tonal)}
.icon{width:40px;height:40px;border-radius:50%;border:0;background:transparent;color:var(--text);display:grid;place-items:center;flex:none}
.icon:hover{background:var(--tonal)}
.wrap{max-width:1000px;margin:0 auto;padding:20px 16px 110px}
section{margin-top:32px}
h2{font-size:30px;font-weight:700;margin-bottom:14px}
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:22px;transition:box-shadow .2s}
.card:hover{box-shadow:var(--shadow2)}
.hero{display:grid;grid-template-columns:auto 1fr;gap:20px;align-items:center;background:var(--tonal);color:var(--on-tonal);padding:28px}
.avatar{width:132px;height:132px;border-radius:50%;object-fit:cover;background:var(--primary);border:4px solid var(--surface);box-shadow:var(--shadow2);display:block}
.proj{display:grid;grid-template-columns:1fr 1fr;gap:22px;align-items:start}
.shot{margin:0}.shot img{width:100%;height:auto;display:block;border-radius:14px;border:1px solid var(--outline)}.shot figcaption{font-size:14px;color:var(--muted);margin-top:8px}
.hero h1{font-size:clamp(34px,7vw,56px);font-weight:700}
.hero p{margin:6px 0 0;font-size:18px}
.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}
.btn{position:relative;overflow:hidden;border:0;border-radius:20px;padding:10px 22px;font-weight:500;text-decoration:none;display:inline-block;background:var(--primary);color:var(--on-primary)}
.btn.out{background:transparent;color:var(--primary);box-shadow:inset 0 0 0 1px var(--primary)}
.rip{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);animation:rip .55s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.chip{border:1px solid var(--outline);background:var(--surface);color:var(--text);border-radius:10px;padding:6px 14px;font-weight:500}
.chip.on{background:var(--tonal);color:var(--on-tonal);border-color:transparent}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.skill{display:flex;gap:12px;padding:12px 0;border-top:1px solid var(--outline)}
.skill b{min-width:150px}
.skill span{color:var(--muted)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);border-bottom:1px solid var(--outline);margin-bottom:16px}
.tab{background:none;border:0;border-bottom:3px solid transparent;padding:12px 6px;font-weight:500;color:var(--muted)}
.tab[aria-selected=true]{color:var(--primary);border-color:var(--primary)}
.muted{color:var(--muted)}
ul{margin:8px 0 0;padding-left:20px}li{margin-bottom:6px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);z-index:9;border-radius:18px;padding:16px 22px;box-shadow:var(--shadow2);background:var(--accent);color:#2B1D00;font-weight:700}
footer{text-align:center;color:var(--muted);margin-top:40px}
@media (max-width:700px){.proj{grid-template-columns:1fr}.avatar{width:112px;height:112px}.grid2{grid-template-columns:1fr}.hero{grid-template-columns:1fr}.skill{flex-direction:column;gap:2px}.bar-in{flex-wrap:wrap}.navs{order:3;width:100%}}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}.rip{animation:none;display:none}}
</style>
</head>

const SKILLS = [
  { cat:'CAD', name:'AutoCAD', note:'2D drafting' },
  { cat:'CAD', name:'SolidWorks', note:'3D parts and assemblies' },
  { cat:'CAD', name:'Fusion 360', note:'3D modelling' },
  { cat:'Drawings', name:'Detail drawings', note:'Part-level drawings' },
  { cat:'Drawings', name:'GA drawings and layouts', note:'Assembly-level views' },
  { cat:'Drawings', name:'Sketch to drawing', note:'Turning rough concepts into engineering drawings' },
  { cat:'Design', name:'Product design and development', note:'NPTEL course' },
  { cat:'Design', name:'Design for manufacturability', note:'Basics' },
  { cat:'Design', name:'Dimensions and tolerances', note:'Basics' },
  { cat:'Prototyping', name:'3D printing', note:'Workshop' },
  { cat:'Prototyping', name:'Arduino electronics', note:'Gas detection project' }
];
const CATS = ['All','CAD','Drawings','Design','Prototyping'];
const STEPS = [
  { t:'Detect', d:'An MQ-6 gas sensor reads the LPG concentration in the air continuously and in real time.' },
  { t:'Decide', d:'An Arduino board compares each reading with a preset PPM threshold.' },
  { t:'Respond', d:'When the threshold is crossed, a servo motor shuts the gas valve, exhaust fans start, a GSM module sends an SMS alert and a buzzer sounds locally.' }
];
const NAV = ['about','skills','project','experience','education','contact'];

function Ripple(props){
  const { as, className, onClick, ...rest } = props;
  const [rs, setRs] = useState([]);
  const go = (e) => {
    const r = e.currentTarget.getBoundingClientRect();
    const s = Math.max(r.width, r.height) * 2;
    const id = Date.now() + Math.random();
    setRs(a => a.concat({ id, x: e.clientX - r.left - s/2, y: e.clientY - r.top - s/2, s }));
    setTimeout(() => setRs(a => a.filter(x => x.id !== id)), 600);
    if (onClick) onClick(e);
  };
  return h(as || 'button', { ...rest, className, onClick: go },
    rest.children,
    rs.map(x => h('span', { key:x.id, className:'rip', style:{ left:x.x, top:x.y, width:x.s, height:x.s } })));
}

function ThemeButton(p){
  const dark = p.theme === 'dark';
  return h('button', { className:'icon', onClick:p.toggle, 'aria-label': dark ? 'Switch to light theme' : 'Switch to dark theme' },
    h('svg', { width:22, height:22, viewBox:'0 0 24 24', fill:'currentColor', 'aria-hidden':true },
      h('path', { d: dark
        ? 'M12 7a5 5 0 100 10 5 5 0 000-10zm0-5h0v3h0V2zm0 17v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3m14 0h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1'
        : 'M21 12.8A9 9 0 1111.2 3a7 7 0 009.8 9.8z' }),
      dark ? h('path', { d:'M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10l2.1 2.1M4.9 19.1L7 17m10-10l2.1-2.1', stroke:'currentColor', strokeWidth:2, fill:'none' }) : null));
}

function useActive(){
  const [on, setOn] = useState('about');
  useEffect(() => {
    const io = new IntersectionObserver(es => {
      es.forEach(e => { if (e.isIntersecting) setOn(e.target.id); });
    }, { rootMargin:'-30% 0px -60% 0px' });
    NAV.forEach(id => { const el = document.getElementById(id); if (el) io.observe(el); });
    return () => io.disconnect();
  }, []);
  return on;
}

function Skills(){
  const [cat, setCat] = useState('All');
  const list = SKILLS.filter(s => cat === 'All' || s.cat === cat);
  return h('div', { className:'card' },
    h('div', { className:'chips', role:'group', 'aria-label':'Filter skills' },
      CATS.map(c => h('button', { key:c, className:'chip' + (c === cat ? ' on' : ''), 'aria-pressed': c === cat, onClick:() => setCat(c) }, c))),
    h('div', { style:{ marginTop:14 } },
      list.map(s => h('div', { className:'skill', key:s.name }, h('b', null, s.name), h('span', null, s.note)))));
}

function Project(){
  const [i, setI] = useState(0);
  return h('div', { className:'card proj' },
    h('figure', { className:'shot' },
      h('img', { src:PROJECT_SRC, alt:'Working prototype of the LPG gas detection system with Arduino Uno, MQ-6 sensor, GSM module, servo motor, fan and buzzer on a board', loading:'lazy' }),
      h('figcaption', null, 'My working prototype on a mounting board.')),
    h('div', null,
      h('div', { className:'tabs', role:'tablist' },
        STEPS.map((s, k) => h('button', { key:s.t, role:'tab', className:'tab', 'aria-selected': k === i, onClick:() => setI(k) }, s.t))),
      h('p', { role:'tabpanel', style:{ margin:0, fontSize:18 } }, STEPS[i].d),
      h('div', { className:'chips', style:{ marginTop:16 } },
        ['Arduino','MQ-6 sensor','Servo motor','GSM module','Exhaust fan','Buzzer'].map(t => h('span', { key:t, className:'chip on' }, t)))));
}

function App(){
  const [theme, setTheme] = useState(() => matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  useEffect(() => { document.documentElement.setAttribute('data-theme', theme); }, [theme]);
  const active = useActive();
  const sec = (id, title, kids) => h('section', { id }, h('h2', null, title), kids);

  return h(React.Fragment, null,
    h('header', { className:'bar' }, h('div', { className:'bar-in' },
      h('div', { className:'brand' }, 'Pratheep S'),
      h(ThemeButton, { theme, toggle:() => setTheme(theme === 'dark' ? 'light' : 'dark') }),
      h('nav', { className:'navs', 'aria-label':'Sections' },
        NAV.map(id => h('a', { key:id, href:'#' + id, className: active === id ? 'on' : '' }, id[0].toUpperCase() + id.slice(1)))))),
    h('main', { className:'wrap' },
      h('div', { className:'card hero' },
        h('img', { className:'avatar', src:PROFILE_SRC, alt:'Portrait of Pratheep S' }),
        h('div', null,
          h('h1', null, 'Pratheep S'),
          h('p', null, 'Mechanical Design Engineer (fresher)'),
          h('p', { style:{ fontSize:15, opacity:.85 } }, 'AutoCAD, SolidWorks and Fusion 360. Erode, Tamil Nadu.'),
          h('div', { className:'row' },
            h(Ripple, { as:'a', className:'btn', href:'#contact' }, 'Get in touch'),
            h(Ripple, { as:'a', className:'btn out', href:LINKEDIN, target:'_blank', rel:'noopener' }, 'LinkedIn')))),

      sec('about', 'About', h('div', { className:'card' },
        h('p', { style:{ marginTop:0 } }, 'I am a mechanical engineering student at KSR College of Engineering, looking for an entry-level design engineer role. I turn sketches and concepts into 2D drawings and 3D models.'),
        h('p', { style:{ marginBottom:0 } }, 'I want to prepare detail drawings, GA drawings and assemblies, and work with production and fabrication teams so designs are practical to build.'))),

      sec('skills', 'Skills', h(Skills)),
      sec('project', 'Project: LPG gas detection and ventilation', h(Project)),

      sec('experience', 'Experience', h('div', { className:'card' },
        h('h3', null, 'Internship, Gomadhi Engineering Company'),
        h('div', { className:'muted' }, '15 days'),
        h('ul', null,
          h('li', null, 'Shadowed and assisted the engineering team in daily industrial workflows.'),
          h('li', null, 'Applied college coursework to real engineering practice.')))),

      sec('education', 'Education', h('div', { className:'grid2' },
        h('div', { className:'card' }, h('h3', null, 'B.E. Mechanical Engineering'), h('div', { className:'muted' }, 'KSR College of Engineering, expected 2027'), h('p', { style:{ marginBottom:0 } }, 'CGPA 7.46')),
        h('div', { className:'card' }, h('h3', null, 'Additional learning'), h('ul', null, h('li', null, 'NPTEL: Product Design and Development'), h('li', null, 'Workshop: 3D printing'))))),

      sec('contact', 'Contact', h('div', { className:'card' },
        h('p', { style:{ marginTop:0 } }, 'I am open to fresher roles in mechanical design and drafting.'),
        h('div', { className:'row', style:{ marginTop:0 } },

      h('footer', null, 'Pratheep S, Erode, Tamil Nadu')),
